[project]
name = "encounter-pipeline"
version = "0.1.0"
description = "Synthetic NEMT encounter pipeline: X12 837P out, 999/277CA back, reconcile and measure."
readme = "README.md"
authors = [
    { name = "Gus Rodriguez", email = "26751374+grodriguez1229@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "faker>=40.43.0",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dbt = [
    "dbt-duckdb>=1.11.1",
]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[project.scripts]
encounters = "encounter_pipeline.cli:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
